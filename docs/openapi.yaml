openapi: 3.0.3
info:
  title: Age Inbox API
  description: >
    A REST API for creating Age-encrypted, password-protected file inboxes. Supports encrypted
    metadata, subfolders created on demand, raw (locked) ciphertext access and HTTP Range requests.


    Authentication model: there is no transport-level auth. Every request re-reads the vault's
    `.inbox-age.config`, so the per-vault permission flags apply immediately to the next request.
    Read operations on decrypted content additionally require an unlock session created by
    `POST /inbox/{name}/unlock`, which lives in server memory for one hour.


    Size semantics: `size` in the listing endpoints and `filesize` in `GET /metadata` are the
    **ciphertext** sizes on disk. The metadata sidecar itself records the **plaintext** byte count,
    which is what the Range total in `GET /download` is computed from.
  version: 1.5.0
  license:
    name: MIT
servers:
  - url: http://127.0.0.1:3000
    description: Local development server
components:
  schemas:
    GenericRes:
      type: object
      properties:
        message:
          type: string
    ErrorRes:
      type: object
      properties:
        error:
          type: string
    VaultPermissions:
      type: object
      description: Granular permission flags controlling which operations are allowed on a vault. All flags default to true except `allow_subfolders` (false).
      required:
        - allow_subfolders
        - allow_upload
        - allow_download
        - allow_list
        - allow_delete
        - allow_metadata
        - allow_lock_unlock
      properties:
        allow_subfolders:
          type: boolean
          description: Whether uploads to subdirectories are allowed.
        allow_upload:
          type: boolean
          description: Whether file uploads to the vault are allowed.
        allow_download:
          type: boolean
          description: Whether downloading is allowed. Applies to both decrypted downloads and `raw/download`.
        allow_list:
          type: boolean
          description: Whether listing vault files is allowed. Applies to both `list` and `raw/list`.
        allow_delete:
          type: boolean
          description: Whether file deletion is allowed. Applies to both `delete` and `raw/delete`.
        allow_metadata:
          type: boolean
          description: Whether accessing decrypted file metadata is allowed.
        allow_lock_unlock:
          type: boolean
          description: Whether lock and unlock operations are allowed.
    CreateInboxPermissions:
      type: object
      description: Optional permission overrides for vault creation. Any omitted field falls back to the server default. Unknown fields are rejected with 422.
      properties:
        allow_subfolders:
          type: boolean
          description: Whether uploads to subdirectories are allowed. Default is false.
        allow_upload:
          type: boolean
          description: Whether file uploads to the vault are allowed. Default is true.
        allow_download:
          type: boolean
          description: Whether downloading is allowed. Default is true.
        allow_list:
          type: boolean
          description: Whether listing vault files is allowed. Default is true.
        allow_delete:
          type: boolean
          description: Whether file deletion is allowed. Default is true.
        allow_metadata:
          type: boolean
          description: Whether accessing decrypted file metadata is allowed. Default is true.
        allow_lock_unlock:
          type: boolean
          description: Whether lock and unlock operations are allowed. Default is true.
    FileMetadata:
      type: object
      description: Decrypted metadata stored in the `.meta.age` sidecar. `filename`, `origin` and `filesize` are first-class; every other multipart field is flattened in as a string.
      properties:
        filename:
          type: string
          nullable: true
        origin:
          type: string
          nullable: true
        filesize:
          type: integer
          format: uint64
          description: >
            Size in bytes. In `GET /metadata` responses this is the encrypted `.age` file size on
            disk (the handler overwrites the value stored in the sidecar).
      additionalProperties: true
    ListedFile:
      type: object
      properties:
        path:
          type: string
          description: Storage path of the encrypted payload, relative to the vault root (for example `drop-9f2c....age`).
        filename:
          type: string
          nullable: true
          description: Original filename recorded in metadata (basename only).
        origin:
          type: string
          nullable: true
        size:
          type: integer
          format: uint64
          description: Size of the encrypted `.age` file on disk, in bytes.
      required:
        - path
        - size
    RawListedFile:
      type: object
      properties:
        path:
          type: string
          description: Storage path of the encrypted payload, relative to the vault root.
        size:
          type: integer
          format: uint64
          description: Size of the encrypted `.age` file on disk, in bytes.
      required:
        - path
        - size
  responses:
    RangeNotSatisfiable:
      description: Range not satisfiable. The body is plain text, not JSON.
      headers:
        Content-Range:
          schema:
            type: string
          description: 'Unsatisfied range, for example `bytes */4096`.'
      content:
        text/plain:
          schema:
            type: string
            example: Range not satisfiable
paths:
  /inbox:
    post:
      operationId: createInbox
      summary: Create a new vault/inbox
      description: >
        Derives an Age identity from the provided password and vault name and creates a new vault on
        disk. Returns the vault's public key, which is the only way to obtain it. The public key is
        not an upload credential: the upload endpoints encrypt server-side with this recipient, and
        no endpoint accepts pre-encrypted ciphertext.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - password
              properties:
                name:
                  type: string
                  description: Unique name for the vault. Must not be empty or contain `/`, `\` or `..`.
                password:
                  type: string
                  description: Password used to derive the key with Argon2id. Never stored.
                permissions:
                  $ref: '#/components/schemas/CreateInboxPermissions'
      responses:
        '200':
          description: Vault successfully created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  public_key:
                    type: string
                    description: X25519 recipient key. Returned only here; not required by the upload endpoints, which encrypt server-side.
        '400':
          description: Invalid vault name, or malformed JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRes'
        '409':
          description: Vault already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRes'
        '415':
          description: Missing `application/json` content type.
        '422':
          description: Structurally invalid body, for example an unknown field.
  /inbox/{name}/config:
    get:
      operationId: getVaultConfig
      summary: Get vault configuration
      description: Returns the public permission policy of a vault. Does not require authentication and never returns the public key.
      security: []
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
          description: The name of the vault.
      responses:
        '200':
          description: Vault configuration retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  permissions:
                    $ref: '#/components/schemas/VaultPermissions'
        '400':
          description: Invalid vault name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRes'
        '404':
          description: Vault or its config file not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRes'
        '500':
          description: Config exists but has no `public-key`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRes'
  /inbox/{name}/upload:
    post:
      operationId: uploadFileRoot
      summary: Upload a file to a vault root
      description: >
        Encrypts the multipart `file` stream and stores it in the vault root. The server generates the
        storage name (`drop-<32 hex>.age`); the original filename travels inside the encrypted
        `.meta.age` sidecar. Uploads are streamed and committed by renaming `.tmp` files into place.
        No key material is accepted or required: the server encrypts with the recipient from vault
        configuration, so `allow_upload` is the only access gate.
      security: []
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
          description: The name of the vault.
      requestBody:
        required: true
        description: Multipart payload containing the binary `file` part plus optional metadata fields.
        content:
          'multipart/form-data':
            schema:
              type: object
              required:
                - file
              properties:
                filename:
                  type: string
                  description: Optional explicit filename. If omitted or empty, the server uses the multipart `file` part filename.
                origin:
                  type: string
                  description: The source origin string.
                extended:
                  type: string
                  description: A JSON-encoded object of additional metadata fields, merged into the sidecar.
                file:
                  type: string
                  format: binary
                  description: The binary file to encrypt and save. Its multipart filename is used as fallback when `filename` is missing/empty.
      responses:
        '200':
          description: File successfully encrypted and stored with metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericRes'
        '400':
          description: Invalid vault name, malformed multipart payload, or missing filename in both the `filename` field and the file part.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRes'
        '403':
          description: Upload not permitted by vault configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRes'
        '404':
          description: Vault not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRes'
        '413':
          description: A non-file multipart field exceeded the 64 KiB limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRes'
        '415':
          description: Unsupported media type. Content-Type must be multipart/form-data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRes'
  /inbox/{name}/upload/{path}:
    post:
      operationId: uploadFilePath
      summary: Upload a file to a subfolder within a vault
      description: >
        Encrypts the multipart `file` stream directly into a nested folder inside the vault, creating
        the subfolder on demand. Fails if the vault configuration disabled nested folders. No key
        material is required; encryption uses the recipient stored in vault configuration.
      security: []
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
          description: The name of the vault.
        - in: path
          name: path
          required: true
          schema:
            type: string
          description: The relative subfolder path. Must not contain `..`, a leading `/`, or `\`.
      requestBody:
        required: true
        description: Multipart form with `file` plus optional metadata fields.
        content:
          'multipart/form-data':
            schema:
              type: object
              required:
                - file
              properties:
                filename:
                  type: string
                  description: Optional explicit filename. If omitted or empty, the server uses the multipart `file` part filename.
                origin:
                  type: string
                extended:
                  type: string
                file:
                  type: string
                  format: binary
                  description: The binary file to encrypt and save. Its multipart filename is used as fallback when `filename` is missing/empty.
      responses:
        '200':
          description: File stored within the specified nested folder.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericRes'
        '400':
          description: Invalid vault name, invalid subfolder path, malformed multipart payload, or missing filename in both the `filename` field and the file part.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRes'
        '403':
          description: Subfolders prohibited by configuration or upload not permitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRes'
        '404':
          description: Vault not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRes'
        '413':
          description: A non-file multipart field exceeded the 64 KiB limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRes'
        '415':
          description: Unsupported media type. Content-Type must be multipart/form-data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRes'
  /inbox/{name}/unlock:
    post:
      operationId: unlockVault
      summary: Temporarily unlock a vault
      description: >
        Validates the password by re-deriving the keypair and comparing the public recipient with the
        stored one, then caches the derived identity in server memory for one hour. The session is
        shared by all clients of the process and is lost on restart.
      security: []
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                password:
                  type: string
      responses:
        '200':
          description: Vault unlocked successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericRes'
        '400':
          description: Invalid vault name or malformed JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRes'
        '401':
          description: Invalid password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRes'
        '403':
          description: Lock/unlock not permitted by vault configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRes'
        '404':
          description: Vault or its config file not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRes'
  /inbox/{name}/lock:
    post:
      operationId: lockVault
      summary: Immediately lock a vault
      description: Removes the vault's in-memory unlock entry, if any.
      security: []
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Vault locked successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericRes'
        '400':
          description: Invalid vault name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRes'
        '403':
          description: Lock/unlock not permitted by vault configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRes'
        '404':
          description: Vault not found, or the vault was not unlocked (`Vault not unlocked`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRes'
  /inbox/{name}/list:
    get:
      operationId: listFiles
      summary: List files in an unlocked vault (with metadata)
      description: >
        Recursively retrieves encrypted payload paths (excluding `.meta.age` sidecars) and decrypts
        each sidecar to include `filename` and `origin`. Reports the encrypted file `size` in bytes.
        Payloads whose sidecar is missing or cannot be decrypted are silently skipped.
        Requires the vault to be unlocked.
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: JSON array of file items with metadata summary and ciphertext size.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ListedFile'
        '400':
          description: Invalid vault name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRes'
        '401':
          description: Vault is locked or the unlock window expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRes'
        '403':
          description: List not permitted by vault configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRes'
        '404':
          description: Vault or its config file not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRes'
  /inbox/{name}/download/{path}:
    get:
      operationId: downloadFile
      summary: Download and decrypt a file
      description: >
        Streams the requested encrypted file back to the client decrypted. Accepts only paths ending
        in `.age` (and not `.meta.age`). Supports a single HTTP Range request; the range is resolved
        against the plaintext size recorded in the sidecar. Always advertises `Accept-Ranges: bytes`.
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
        - in: path
          name: path
          required: true
          schema:
            type: string
          description: Relative path of the encrypted file inside the vault (must end in `.age`).
        - in: header
          name: Range
          required: false
          schema:
            type: string
          description: 'Single byte range, for example `bytes=0-1023`, `bytes=1024-` or `bytes=-500`. Multi-range requests are not supported.'
      responses:
        '200':
          description: The full decrypted binary file.
          headers:
            Accept-Ranges:
              schema:
                type: string
              description: 'Always `bytes`.'
            Content-Disposition:
              schema:
                type: string
              description: 'Attachment disposition with the resolved filename (e.g. `attachment; filename="report.pdf"`).'
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: Partial decrypted content for the requested byte range.
          headers:
            Content-Range:
              schema:
                type: string
              description: 'Byte range and plaintext total size (e.g. `bytes 0-1023/34912`).'
            Content-Length:
              schema:
                type: string
              description: 'Number of bytes in this partial response.'
            Accept-Ranges:
              schema:
                type: string
            Content-Disposition:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid path, or a path that is not an encrypted `.age` payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRes'
        '401':
          description: Vault is locked or the unlock window expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRes'
        '403':
          description: Download not permitted by vault configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRes'
        '404':
          description: File not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRes'
        '416':
          $ref: '#/components/responses/RangeNotSatisfiable'
  /inbox/{name}/metadata/{path}:
    get:
      operationId: downloadMetadata
      summary: Get decrypted metadata for a file
      description: >
        Returns decrypted metadata from the `.meta.age` sidecar associated with an encrypted file
        path. The response `filesize` is the encrypted file size on disk, which overwrites the
        plaintext size recorded in the sidecar.
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
        - in: path
          name: path
          required: true
          schema:
            type: string
          description: Relative path of the encrypted file inside the vault (must end in `.age` and not `.meta.age`).
      responses:
        '200':
          description: Decrypted metadata as JSON, including the ciphertext `filesize`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileMetadata'
        '400':
          description: Invalid path, or a path that is not an encrypted `.age` payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRes'
        '401':
          description: Vault is locked or the unlock window expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRes'
        '403':
          description: Metadata access not permitted by vault configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRes'
        '404':
          description: Metadata sidecar not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRes'
  /inbox/{name}/delete/{path}:
    delete:
      operationId: deleteFile
      summary: Delete an encrypted file (requires unlock)
      description: >
        Deletes the specified file and its associated `.meta.age` sidecar (if present). Requires a
        session entry for the vault; presence is checked, not expiry. No `.age` suffix validation is
        performed, but the resolved path must stay inside the vault directory.
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
          description: The name of the vault.
        - in: path
          name: path
          required: true
          schema:
            type: string
          description: Relative path of the file inside the vault.
      responses:
        '200':
          description: File (and metadata sidecar if present) deleted. Empty body.
        '400':
          description: Invalid name or path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRes'
        '403':
          description: Vault is locked, or delete not permitted by vault configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRes'
        '404':
          description: Vault or file not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRes'
  /inbox/{name}/raw/list:
    get:
      operationId: listFilesRaw
      summary: List files in a vault (no unlock required)
      description: >
        Recursively retrieves encrypted payload paths and their ciphertext sizes on disk. Does NOT
        decrypt metadata and returns only `path` and `size`. Payloads without a `.meta.age` sidecar
        are skipped. Works regardless of whether the vault is locked or unlocked. Unauthenticated.
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: JSON array of raw file items with path and ciphertext size.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RawListedFile'
        '400':
          description: Invalid vault name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRes'
        '403':
          description: List not permitted by vault configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRes'
        '404':
          description: Vault not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRes'
  /inbox/{name}/raw/download/{path}:
    get:
      operationId: downloadFileRaw
      summary: Download an encrypted file without decryption
      description: >
        Streams the encrypted `.age` file as-is. Works regardless of vault lock state and supports
        HTTP Range requests by seeking on disk. Unauthenticated: anyone who can reach the server can
        read ciphertext.
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
        - in: path
          name: path
          required: true
          schema:
            type: string
          description: Relative path of the encrypted file inside the vault (must end in `.age` and not `.meta.age`).
        - in: header
          name: Range
          required: false
          schema:
            type: string
          description: 'Single byte range, for example `bytes=0-1023`, `bytes=1024-` or `bytes=-500`.'
      responses:
        '200':
          description: The encrypted binary file as-is.
          headers:
            Content-Length:
              schema:
                type: string
              description: 'Total size of the encrypted file in bytes.'
            Accept-Ranges:
              schema:
                type: string
              description: 'Always `bytes`.'
            Content-Disposition:
              schema:
                type: string
              description: 'Attachment disposition with the `.age` filename (e.g. `attachment; filename="drop-9f2c....age"`).'
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: Partial encrypted content for the requested byte range.
          headers:
            Content-Range:
              schema:
                type: string
              description: 'Byte range and ciphertext total size (e.g. `bytes 0-1023/35120`).'
            Content-Length:
              schema:
                type: string
              description: 'Number of bytes in this partial response.'
            Accept-Ranges:
              schema:
                type: string
            Content-Disposition:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid path, or a path that is not an encrypted `.age` payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRes'
        '403':
          description: Download not permitted by vault configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRes'
        '404':
          description: Vault or file not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRes'
        '416':
          $ref: '#/components/responses/RangeNotSatisfiable'
  /inbox/{name}/raw/delete/{path}:
    delete:
      operationId: deleteFileRaw
      summary: Delete an encrypted file without requiring unlock
      description: >
        Deletes the specified file and its associated `.meta.age` sidecar (if present). Works
        regardless of vault lock state. Unauthenticated.
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
          description: The name of the vault.
        - in: path
          name: path
          required: true
          schema:
            type: string
          description: Relative path of the file inside the vault.
      responses:
        '200':
          description: File (and metadata sidecar if present) deleted. Empty body.
        '400':
          description: Invalid name or path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRes'
