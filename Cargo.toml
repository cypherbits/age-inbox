[package]
name = "age-inbox-server"
version = "0.1.0"
edition = "2021"

[lib]
name = "age_inbox"

[workspace]
members = [".", "crates/age-inbox-core"]

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8.8", features = ["multipart"] }
age = { version = "0.11.2", features = ["async"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io", "compat"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
rcgen = { version = "0.14.7", features = ["pem"] }
clap = { version = "4.6.1", features = ["derive"] }
tower-http = { version = "0.6", features = ["cors"] }
age-inbox-core = { path = "crates/age-inbox-core" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
reqwest = { version = "0.13.2", features = ["json", "multipart"] }
tempfile = "3.27.0"
