name: PR Check (Manual)

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to verify (e.g. 32 or #32)"
        required: true
        type: string

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Checkout PR branch
        env:
          PR_INPUT: ${{ github.event.inputs.pr }}
        run: |
          set -euo pipefail
          PR="${PR_INPUT#\#}"
          if [[ ! "$PR" =~ ^[0-9]+$ ]]; then
            echo "Invalid PR number: $PR_INPUT"
            exit 1
          fi
          gh pr checkout "$PR"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build (workspace, all targets)
        run: cargo build --workspace --all-targets --locked

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Report result on PR
        if: ${{ always() }}
        env:
          PR_INPUT: ${{ github.event.inputs.pr }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          PR="${PR_INPUT#\#}"
          SHA="$(git rev-parse --short HEAD)"
          if [ "$JOB_STATUS" = "success" ]; then
            gh pr comment "$PR" --body "✅ **PR Check** passed on \`$SHA\`: it builds and all tests pass. Ready to merge. ([log]($RUN_URL))"
            gh pr edit "$PR" --add-label "verified" || true
          else
            gh pr comment "$PR" --body "❌ **PR Check** failed on \`$SHA\`. Review the result before merging. ([log]($RUN_URL))"
          fi
