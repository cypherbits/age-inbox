[package]
name = "age-inbox-core"
version = "0.1.0"
edition = "2021"
description = "Reusable cryptographic inbox core built on age"
license = "MIT"

[dependencies]
age = { version = "0.11.2", features = ["async"] }
argon2 = "0.5"
zeroize = { version = "1.7", features = ["zeroize_derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1"
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "compat"] }
bech32 = "0.11.1"
